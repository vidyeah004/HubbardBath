name: research-results

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  reproduce-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate repository
        run: python -m pytest -q

      - name: Equilibrium thermal sweep
        run: python experiments/run_thermal_sweep.py

      - name: Open-system thermalisation demo
        run: python experiments/run_thermalisation_demo.py

      - name: Liouvillian gap sweep
        run: python experiments/run_spectral_gap_sweep.py

      - name: Jordan-Wigner mapping
        run: python experiments/run_jordan_wigner_mapping.py

      - name: Hamiltonian simulation
        run: python experiments/run_hamiltonian_simulation.py

      - name: LCU block encoding
        run: python experiments/run_block_encoding.py

      - name: Thermal polynomial / QSVT readiness
        run: python experiments/run_thermal_polynomial_qsvt.py

      - name: Physical vs algorithmic comparison
        run: python experiments/run_physical_algorithmic_comparison.py

      - name: Print headline summaries
        if: always()
        run: |
          echo "===== M4: Liouvillian gap vs mixing ====="
          cat results/milestone04_summary.json 2>/dev/null || true
          echo
          echo "===== M6: Hamiltonian simulation ====="
          cat results/milestone06_summary.json 2>/dev/null || true
          echo
          echo "===== M7: Block encoding ====="
          cat results/milestone07_summary.json 2>/dev/null || true
          echo
          echo "===== M8: Thermal polynomial ====="
          cat results/milestone08_summary.json 2>/dev/null || true
          echo
          echo "===== M9: Physical vs algorithmic ====="
          cat results/milestone09_summary.json 2>/dev/null || true

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubbardbath-research-results
          path: |
            results/*.csv
            results/*.json
            figures/*.png
          if-no-files-found: warn
          retention-days: 30
